version: '3.8'

services:
  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile.dev
    container_name: cqrs-demo-backend
    ports:
      - "8080:8080"
    environment:
      - DB_PATH=/app/data/demo.db
    volumes:
      # データベースファイルの永続化
      - ./data:/app/data
      # 開発時のホットリロード用（ソースコードをマウント）
      - ./packages/backend:/app
      # Mavenのローカルリポジトリをキャッシュ（ビルド高速化）
      - maven-cache:/root/.m2
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  maven-cache:

